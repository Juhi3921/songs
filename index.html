<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Night - Strudel Song</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="music-app">

        <!-- HEADER -->

        <header>

            <h1>NEON NIGHT</h1>

            <p>
                A 30-second song made with HTML, CSS, JavaScript & Strudel
            </p>

            <div class="themes">

                <button id="darkBtn">
                    DARK
                </button>

                <button id="neonBtn">
                    NEON
                </button>

            </div>

        </header>


        <!-- PLAYER -->

        <section class="player">

            <div class="visualizer" id="visualizer">

                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>

            </div>


            <div class="time">

                <span id="currentTime">
                    00:00
                </span>

                <span>
                    / 00:30
                </span>

            </div>


            <div class="progress">

                <div id="progressBar"></div>

            </div>


            <div class="buttons">

                <button id="playButton">
                    PLAY
                </button>

                <button id="stopButton">
                    STOP
                </button>

            </div>


            <div class="status" id="status">
                Ready to play
            </div>

        </section>
